name: Compile Examples for ESP32

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn:
          - "esp32:esp32:esp32"
          - "esp32:esp32:esp32s3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install dependencies
        run: |
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "M5ModuleLLM@1.3.0"
          arduino-cli lib install "M5Stack_Avatar@0.10.0"

      - name: Compile examples
        run: |
          set -e
          # Find all .ino files under examples
          IFS=$'\n' read -d '' -r -a inos < <(find ./examples -type f -name '*.ino' -print0 | xargs -0 -n1 echo) || true
          if [ ${#inos[@]} -eq 0 ]; then
            echo "No example sketches found."
            exit 0
          fi
          for ino in "${inos[@]}"; do
            echo "Compiling $ino"
            arduino-cli compile --fqbn ${{ matrix.fqbn }} --libraries . "$ino" || exit 1
          done